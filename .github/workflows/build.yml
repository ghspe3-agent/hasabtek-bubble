name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: generate gradle wrapper (in empty dir to avoid project configuration with system gradle)
        run: |
          mkdir -p "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w" && echo "rootProject.name='w'" > settings.gradle && gradle wrapper --gradle-version 8.7 --distribution-type bin
          cp -r "$RUNNER_TEMP/w/gradlew" "$RUNNER_TEMP/w/gradlew.bat" "$RUNNER_TEMP/w/gradle" "$GITHUB_WORKSPACE/"
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hasabtek-bubble-apk
          path: app/build/outputs/apk/debug/app-debug.apk
